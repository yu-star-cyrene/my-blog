name: 部署到 GitHub Pages
on:
  push:
    branches: [ main ] # 确认你本地推送的是 main
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # 必须：允许 Actions 写入 Pages
  id-token: write   # 必须：用于证书验证

jobs:
  build:
    name: 构建网站
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: 安装 pnpm
        run: npm install -g pnpm
      - name: 安装依赖
        run: pnpm install
      - name: 构建 Astro 网站
        run: pnpm run build
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # 网页生成的文件夹

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # 真正的“最后一步”发布
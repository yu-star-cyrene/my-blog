<style>
  /* 隐藏网址栏 */
  .tk-meta-input .el-input:nth-child(3) { display: none !important; }
  .tk-meta-input input[name="link"] { display: none !important; }
  .tk-meta-input .el-input { width: 48% !important; }
  @media (max-width: 768px) { .tk-meta-input .el-input { width: 100% !important; } }
</style>

<script>
  // 1. 界面文字修改
  var labelTimer = setInterval(function() {
      var mailInput = document.querySelector('input[name="mail"]');
      if (mailInput) {
          // --- 修改提示文字 ---
          mailInput.placeholder = "请填入qq号";
          
          var container = mailInput.closest('.el-input-group');
          if (container) {
              var label = container.querySelector('.el-input-group__prepend');
              if (label) label.innerText = "头像";
              clearInterval(labelTimer);
          }
      }
  }, 200);

  // 2. 自动补全 @qq.com 逻辑 (保留)
  document.body.addEventListener('focusout', function(e) {
      if (e.target && e.target.tagName === 'INPUT' && e.target.name === 'mail') {
          var val = e.target.value.trim();
          // 如果是纯数字 (5-13位)，自动补全
          if (/^\d{5,13}$/.test(val)) {
              e.target.value = val + "@qq.com";
              e.target.dispatchEvent(new Event('input', { bubbles: true }));
              e.target.dispatchEvent(new Event('change', { bubbles: true }));
          }
      }
  });
</script>
